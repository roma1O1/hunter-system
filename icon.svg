  </g>
  
  <g filter="url(#glowMd)" stroke="url(#slash)" stroke-width="3" fill="none" opacity="0.8">
    <path d="M 130 100 L 180 90"/>
    <path d="M 340 90 L 390 100"/>
    <path d="M 130 412 L 180 422"/>
    <path d="M 340 422 L 390 412"/>
  </g>
  
  <g filter="url(#glowSm)" opacity="0.9">
