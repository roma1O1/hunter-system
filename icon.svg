    <line x1="110" y1="260" x2="410" y2="260" stroke-dasharray="2,4"/>
    <line x1="110" y1="300" x2="410" y2="300" stroke-dasharray="2,4"/>
  </g>
  
  <g filter="url(#glowMd)">
