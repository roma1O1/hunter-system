<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#06121f"/>
      <stop offset="60%" stop-color="#020608"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="auraOuter" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#00b0ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="irisGrad" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#a0ffff"/>
      <stop offset="45%" stop-color="#00ffff"/>
      <stop offset="75%" stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#003d66"/>
    </radialGradient>
    <radialGradient id="irisCenter" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#00ffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slash" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowSm">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMd">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="auraBlur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>
  
  <ellipse cx="256" cy="256" rx="220" ry="220" fill="url(#auraOuter)" filter="url(#auraBlur)"/>
  
  <g filter="url(#glowBig)" opacity="0.85">
    <ellipse cx="256" cy="256" rx="140" ry="90" fill="#00e5ff" opacity="0.35"/>
  </g>
  
  <g filter="url(#glowMd)">
    <path d="M 60 256 Q 130 140 256 140 Q 382 140 452 256 Q 382 372 256 372 Q 130 372 60 256 Z" 
