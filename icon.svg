    <ellipse cx="256" cy="256" rx="16" ry="58" fill="none" stroke="#00ffff" stroke-width="2" opacity="0.9"/>
    <ellipse cx="256" cy="256" rx="6" ry="50" fill="#0a1a30"/>
  </g>
  
  <g filter="url(#glowSm)" opacity="0.9">
