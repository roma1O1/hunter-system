<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#0a1f38"/>
      <stop offset="55%" stop-color="#050d1a"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003d5c"/>
      <stop offset="20%" stop-color="#0088cc"/>
      <stop offset="45%" stop-color="#00e5ff"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#00e5ff"/>
      <stop offset="80%" stop-color="#0088cc"/>
      <stop offset="100%" stop-color="#003d5c"/>
    </linearGradient>
    <linearGradient id="bladeEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="guardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#001a2e"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#001a2e"/>
