    <polygon points="392,90 398,96 392,102 386,96"/>
    <polygon points="120,428 126,434 120,440 114,434"/>
    <polygon points="392,428 398,434 392,440 386,434"/>
  </g>
  
  <g filter="url(#glowSm)" opacity="0.5" stroke="#00e5ff" stroke-width="1.5">
