<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%">
      <stop offset="0%" stop-color="#0a1f38"/>
      <stop offset="60%" stop-color="#050d1a"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#00e5ff"/>
      <stop offset="70%" stop-color="#0088cc"/>
      <stop offset="100%" stop-color="#003d5c"/>
    </linearGradient>
    <linearGradient id="hilt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003d5c"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#003d5c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  
  <rect x="30" y="30" width="452" height="452" rx="60" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.2"/>
  
  <g filter="url(#glow)" fill="none" stroke="#00e5ff" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M 70 130 L 70 70 L 130 70"/>
    <path d="M 382 70 L 442 70 L 442 130"/>
    <path d="M 70 382 L 70 442 L 130 442"/>
    <path d="M 382 442 L 442 442 L 442 382"/>
  </g>
  
  <g filter="url(#glow)" opacity="0.9">
    <polygon points="256,80 268,110 256,250 244,110" fill="url(#blade)"/>
    <polygon points="256,80 261,110 256,250 251,110" fill="#ffffff" opacity="0.6"/>
    
    <rect x="228" y="248" width="56" height="10" fill="url(#hilt)"/>
    <rect x="234" y="258" width="44" height="6" fill="#00e5ff" opacity="0.7"/>
    
    <polygon points="244,264 268,264 262,320 250,320" fill="#001f33" stroke="#00e5ff" stroke-width="2"/>
    <line x1="256" y1="264" x2="256" y2="318" stroke="#00e5ff" stroke-width="1.5" opacity="0.8"/>
    <line x1="250" y1="264" x2="250" y2="318" stroke="#00e5ff" stroke-width="0.8" opacity="0.4"/>
    <line x1="262" y1="264" x2="262" y2="318" stroke="#00e5ff" stroke-width="0.8" opacity="0.4"/>
    
    <polygon points="248,320 264,320 256,340" fill="url(#hilt)"/>
    <circle cx="256" cy="336" r="4" fill="#00e5ff"/>
  </g>
  
  <g filter="url(#glow)" fill="#00e5ff" opacity="0.9">
    <polygon points="140,180 145,190 140,200 135,190"/>
    <polygon points="372,180 377,190 372,200 367,190"/>
    <polygon points="140,310 145,320 140,330 135,320"/>
    <polygon points="372,310 377,320 372,330 367,320"/>
  </g>
  
  <g stroke="#00e5ff" stroke-width="2" opacity="0.55" filter="url(#glow)">
    <line x1="105" y1="256" x2="135" y2="256"/>
    <line x1="377" y1="256" x2="407" y2="256"/>
    <line x1="256" y1="105" x2="256" y2="72" opacity="0.3"/>
  </g>
  
  <g filter="url(#softGlow)" opacity="0.5">
    <text x="256" y="440" text-anchor="middle" font-family="'Orbitron','Arial',sans-serif" font-size="30" font-weight="900" fill="#00e5ff" letter-spacing="8">◆ ◆ ◆</text>
  </g>
  
  <g filter="url(#glow)" opacity="0.85">
    <text x="105" y="435" text-anchor="middle" font-family="'Orbitron','Arial',sans-serif" font-size="22" font-weight="900" fill="#00e5ff">S</text>
    <text x="407" y="435" text-anchor="middle" font-family="'Orbitron','Arial',sans-serif" font-size="22" font-weight="900" fill="#00e5ff">S</text>
  </g>
</svg>
