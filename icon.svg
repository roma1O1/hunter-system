    <rect x="332" y="120" width="40" height="2" fill="#00e5ff"/>
    <rect x="140" y="390" width="40" height="2" fill="#00e5ff"/>
    <rect x="332" y="390" width="40" height="2" fill="#00e5ff"/>
  </g>
  
