    <line x1="256" y1="297" x2="256" y2="312"/>
    <line x1="200" y1="256" x2="215" y2="256"/>
    <line x1="297" y1="256" x2="312" y2="256"/>
    <line x1="216" y1="216" x2="226" y2="226"/>
