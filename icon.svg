    <line x1="392" y1="108" x2="392" y2="140"/>
    <line x1="120" y1="372" x2="120" y2="410"/>
    <line x1="392" y1="372" x2="392" y2="410"/>
  </g>
  
  <g filter="url(#glowSm)" opacity="0.7">
