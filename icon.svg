  <g filter="url(#glowSm)" fill="none" stroke="#00e5ff" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M 80 178 L 80 160 L 98 160"/>
    <path d="M 432 178 L 432 160 L 414 160"/>
    <path d="M 80 334 L 80 352 L 98 352"/>
    <path d="M 432 334 L 432 352 L 414 352"/>
