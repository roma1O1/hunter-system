    <line x1="196" y1="256" x2="316" y2="256" stroke="#00e5ff" stroke-width="1" opacity="0.5"/>
    <line x1="215" y1="215" x2="297" y2="297" stroke="#00e5ff" stroke-width="1" opacity="0.4"/>
    <line x1="297" y1="215" x2="215" y2="297" stroke="#00e5ff" stroke-width="1" opacity="0.4"/>
  </g>
  
  <g filter="url(#glowBig)">
