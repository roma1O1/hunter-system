  </g>
  
  <g filter="url(#glow)" opacity="0.9">
    <text x="105" y="110" text-anchor="middle" font-family="'Orbitron','Arial',sans-serif" font-size="24" font-weight="900" fill="#00e5ff">E</text>
    <text x="407" y="110" text-anchor="middle" font-family="'Orbitron','Arial',sans-serif" font-size="24" font-weight="900" fill="#00e5ff">S</text>
    <text x="105" y="420" text-anchor="middle" font-family="'Orbitron','Arial',sans-serif" font-size="24" font-weight="900" fill="#00e5ff">S</text>
    <text x="407" y="420" text-anchor="middle" font-family="'Orbitron','Arial',sans-serif" font-size="24" font-weight="900" fill="#00e5ff">E</text>
