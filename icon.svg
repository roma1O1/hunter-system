<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="50%" stop-color="#000"/>
      <stop offset="100%" stop-color="#050d1a"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#00b0ff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="glowSm">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMd">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  
  <g opacity="0.5" filter="url(#glowBig)">
    <rect x="70" y="150" width="372" height="212" rx="6" fill="#00e5ff"/>
  </g>
  
  <g filter="url(#glowMd)">
    <rect x="80" y="160" width="352" height="192" rx="4" fill="url(#panelGrad)" stroke="url(#borderGrad)" stroke-width="3"/>
  </g>
  
  <rect x="80" y="160" width="352" height="36" rx="4" fill="#00e5ff" opacity="0.2"/>
  <line x1="80" y1="196" x2="432" y2="196" stroke="#00e5ff" stroke-width="1.5" opacity="0.9"/>
  
  <g filter="url(#glowSm)">
