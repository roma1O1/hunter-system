    <circle cx="412" cy="256" r="5" fill="#00e5ff"/>
    <circle cx="256" cy="90" r="4" fill="#00e5ff" opacity="0.7"/>
    <circle cx="256" cy="422" r="4" fill="#00e5ff" opacity="0.7"/>
  </g>
  
  <g filter="url(#glowSm)" stroke="#00e5ff" stroke-width="1.5" opacity="0.5">
    <line x1="100" y1="256" x2="130" y2="256"/>
    <line x1="382" y1="256" x2="412" y2="256"/>
    <line x1="256" y1="110" x2="256" y2="130"/>
    <line x1="256" y1="382" x2="256" y2="402"/>
