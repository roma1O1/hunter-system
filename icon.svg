    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000814"/>
      <stop offset="50%" stop-color="#003d5c"/>
      <stop offset="100%" stop-color="#000814"/>
    </linearGradient>
    <filter id="glowSm">
      <feGaussianBlur stdDeviation="3" result="b"/>
